1. Accepts any HTTP request regardless of method or body.\n2. Unconditionally writes `200 OK`.\n3. Contains a comment indicating it is intended to call an external payment gateway \u2014 but that call is not yet implemented.\n\n---\n\n## Existing Tests\n\nNone. No `handler_test.go` or any other `*_test.go` file exists in the package.\n\n---\n\n## Coverage Gap Report\n\n### Critical\n\n| # | Gap | Why Critical |\n|---|-----|-------------|\n| C1 | No test verifies `HandlePayment` returns `200 OK` for a valid request | Zero coverage of the only observable behavior the function currently has |\n| C2 | No test verifies the function satisfies the `http.HandlerFunc` signature | Signature breakage would be caught at compile time in a test but is invisible without one |\n\n### High\n\n| # | Gap | Why High |\n|---|-----|---------|\n| H1 | HTTP method is not validated \u2014 no test documents expected vs. rejected methods | A payment endpoint should almost certainly be `POST`-only; the current code accepts `GET`, `DELETE`, etc. silently |\n| H2 | No test for an unsupported method returning `405 Method Not Allowed` | Closely related to H1; the missing guard needs both a positive and a negative test |\n| H3 | Request body is never read \u2014 no test with a malformed or empty body | When the gateway call is implemented, body parsing will be the first thing added; no baseline test exists to catch regressions |\n\n### Medium\n\n| # | Gap | Why Medium |\n|---|-----|-----------|\n| M1 | No test for missing or malformed `Content-Type: application/json` header | Payment APIs typically require JSON; a test asserting `415 Unsupported Media Type` documents that contract |\n| M2 | No test for response headers (e.g. `Content-Type` on the response) | Callers may depend on the response content type; currently nothing is set |\n| M3 | Gateway call is stubbed with a comment \u2014 no test surface for gateway errors (timeout, non-2xx, network failure) | Once implemented, error paths will need tests; a TODO comment in tests now avoids the debt later |\n\n### Low\n\n| # | Gap | Why Low |\n|---|-----|--------|\n| L1 | No benchmark for handler throughput | Not urgent, but payments are latency-sensitive |\n| L2 | No test for concurrent requests (race detector) | `go test -race` would catch shared state bugs if state is introduced later |\n\n---\n\n## Recommended Tests to Write (Priority Order)\n\n### 1. Happy-path smoke test (closes C1, C2)\n\n```go\nfunc TestHandlePayment_Returns200(t *testing.T) {\n    req := httptest.NewRequest(http.MethodPost, \"/payments\", nil)\n    rr := httptest.NewRecorder()\n\n    HandlePayment(rr, req)\n\n    if rr.Code != http.StatusOK {\n        t.Errorf(\"expected 200, got %d\", rr.Code)\n    }\n}\n```\n\n### 2. Reject non-POST methods (closes H1, H2)\n\n```go\nfunc TestHandlePayment_RejectsNonPost(t *testing.T) {\n    methods := []string{http.MethodGet, http.MethodPut, http.MethodDelete, http.MethodPatch}\n    for _, method := range methods {\n        t.Run(method, func(t *testing.T) {\n            req := httptest.NewRequest(method, \"/payments\", nil)\n            rr := httptest.NewRecorder()\n            HandlePayment(rr, req)\n            if rr.Code != http.StatusMethodNotAllowed {\n                t.Errorf(\"%s: expected 405, got %d\", method, rr.Code)\n            }\n        })\n    }\n}\n```\n\n### 3. Empty body returns 400 Bad Request (closes H3)\n\n```go\nfunc TestHandlePayment_EmptyBodyReturnsBadRequest(t *testing.T) {\n    req := httptest.NewRequest(http.MethodPost, \"/payments\", http.NoBody)\n    req.Header.Set(\"Content-Type\", \"application/json\")\n    rr := httptest.NewRecorder()\n\n    HandlePayment(rr, req)\n\n    if rr.Code != http.StatusBadRequest {\n        t.Errorf(\"expected 400, got %d\", rr.Code)\n    }\n}\n```\n\n### 4. Wrong Content-Type returns 415 (closes M1)\n\n```go\nfunc TestHandlePayment_WrongContentType(t *testing.T) {\n    req := httptest.NewRequest(http.MethodPost, \"/payments\",\n        strings.NewReader(`{\"amount\":100}`))\n    req.Header.Set(\"Content-Type\", \"text/plain\")\n    rr := httptest.NewRecorder()\n\n    HandlePayment(rr, req)\n\n    if rr.Code != http.StatusUnsupportedMediaType {\n        t.Errorf(\"expected 415, got %d\", rr.Code)\n    }\n}\n```\n\n---\n\n## Notes\n\n- All four test cases use only `net/http/httptest` from the standard library \u2014 no new dependencies required.\n- Tests 2, 3, and 4 are **currently failing** by design (the handler does not implement those guards yet). They should be written as red tests first, then the handler updated to make them green \u2014 consistent with a TDD approach.\n- Once the external gateway call is added, a gateway interface/port should be introduced so tests can inject a fake, keeping tests fast and deterministic without real network calls.\n", "grading": null, "timing": null}}}, "4": {"id": 4, "metadata": {"eval_id": 4, "eval_name": "polyglot-ts-plus-go", "prompt": "TS controller + Go resizer. Verify separate language sections, no syntax bleeding.", "assertions": [{"text": "Separate TypeScript and Go sections", "passed": null, "evidence": ""}, {"text": "TypeScript section uses describe/it", "passed": null, "evidence": ""}, {"text": "Go section uses func Test*", "passed": null, "evidence": ""}]}, "configs": {"with_skill": {"report": "# Coverage Gap Report\n\n2 files changed (1 TypeScript, 1 Go), gaps found (1 critical, 5 high, 4 medium, 1 low)\n\n---\n\n## TypeScript\n\n### \ud83d\udd34 Critical\n\n**`apps/server/upload.controller.ts`**\n- Missing: No test file exists for this HTTP controller\n- Suggested: `When a valid upload request is received, Then the controller returns HTTP 200 with the upload result`\n\n### \ud83d\udfe0 High\n\n**`apps/server/upload.controller.ts`**\n\nGap 1 \u2014 Error path: invalid input (Exit Door 5)\n- `When the request payload is missing required fields, Then the controller returns HTTP 400 with a descriptive error body`\n\nGap 2 \u2014 State verification afte ails the !amount guard', async () => {\n      const req = makeRequest({ amount: 0 })\n      const reply = makeReply()\n\n      await createPayment(req, reply as unknown as FastifyReply)\n\n      expect(reply._code).toBe(400)\n      expect(reply._body).toEqual({ error: 'amount required' })\n    })\n  })\n\n  describe('When amount is null', () => {\n    it('Then it responds with 400', async () => {\n      const req = makeRequest({ amount: null })\n      const reply = makeReply()\n\n      await createPayment(req, reply as unknown as FastifyReply)\n\n      expect(reply._code).toBe(400)\n      expect(reply._body).toEqual({ error: 'amount required' })\n    })\n  })\n\n  describe('When a valid positive amount is provided', () => {\n    it('Then it responds with 201 and a payment object containing id and amount', async () => {\n      const req = makeRequest({ amount: 5000 })\n      const reply = makeReply()\n\n      await createPayment(req, reply as unknown as FastifyReply)\n\n      expect(reply._code).toBe(201)\n      expect(reply._body).toEqual({ id: 'pay_123', amount: 5000 })\n    })\n\n    it('Then the response echoes back the exact amount from the request', async () => {\n      const req = makeRequest({ amount: 9999 })\n      const reply = makeReply()\n\n      await createPayment(req, reply as unknown as FastifyReply)\n\n      expect((reply._body as { amount: number }).amount).toBe(9999)\n    })\n  })\n\n  describe('When amount is a negative number', () => {\n    it('Then it currently responds with 201 (documents missing domain validation)', async () => {\n      // NOTE: negative values pass through because -100 is truthy.\n      // This test documents current behavior; a future story should add domain validation.\n      const req = makeRequest({ amount: -100 })\n      const reply = makeReply()\n\n      await createPayment(req, reply as unknown as FastifyReply)\n\n      expect(reply._code).toBe(201)\n    })\n  })\n\n  describe('When amount is a non-numeric string', () responds 400 with error message', async () => {\n    // Arrange\n    const mockReply = { code: vi.fn().mockReturnThis(), send: vi.fn() }\n    const mockReq = { body: {} }\n\n    // Act\n    await createPayment(mockReq as FastifyRequest, mockReply as unknown as FastifyReply)\n\n    // Assert\n    expect(mockReply.code).toHaveBeenCalledWith(400)\n    expect(mockReply.send).toHaveBeenCalledWith({ error: 'amount required' })\n  })\n})\n```\n\n### \ud83d\udfe1 Medium\n\n_None_\n\n### \ud83d\udfe2 Low\n\n_None_\n\n### \u2705 Already Covered\n\n_None \u2014 no test files exist in this repo._\n\n### \u23ed\ufe0f Skipped\n\n- `apps/server/payment.controller.ts` \u2014 Exit Door 2 (state): dropped \u2014 no persistence code in source (DB call comment only, no actual repository or DB write)\n- `apps/server/payment.controller.ts` \u2014 Exit Door 3 (external call): dropped \u2014 no external call code in source (`// calls use-case, writes to DB` is a comment, not real logic)\n- `apps/server/payment.controller.ts` \u2014 Exit Door 4 (queue events): dropped \u2014 no queue publish code in source\n\n### Remediation Plan\n\n1. Create `apps/server/payment.controller.test.ts` and add the Critical gap test: happy-path 201 response with `{ id, amount }` shape (Exit Door 1).\n2. Add the High gap test in the same file: missing-amount 400 response with `{ error: 'amount required' }` (Exit Door 5).\n", "grading": {"expectations": [{"text": "Output contains TypeScript test syntax", "passed": true, "evidence": "describe/it blocks with When/Then naming and expect() assertions present"}, {"text": "Output does NOT contain Go/Angular/Flutter syntax", "passed": true, "evidence": "0 matches for func Test, TestBed, testWidgets"}, {"text": "Identifies Critical or High gap for controller", "passed": true, "evidence": "Critical: HTTP controller no test file. High: missing error path. Exit Door 2/3/4 correctly dropped (no persistence/external call code in source)."}], "summary": {"pass_rate": 1.0, "passed": 3, "failed": 0, "total": 3}}, "timing": {"total_tokens": 21418, "duration_ms": 85819, "total_duration_seconds": 85.8}}, "without_skill": {"report": "# Test Coverage Gap Report: `payment.controller.ts`\n\n## Summary\n\nThe `createPayment` controller has **zero existing tests**. The function is a Fastify route handler that validates an `amount` field from the request body, then returns a created payment response. All branches and behaviors are untested.\n\n---\n\n## Public Interface Under Test\n\n```ts\nexport async function createPayment(req: FastifyRequest, reply: FastifyReply): Promise<void>\n```\n\n---\n\n## Coverage Gaps\n\n### Priority: Critical\n\n| # | Gap | Reason |\n|---|-----|--------|\n| 1 | Missing `amount` in request body returns 400 | Core validation branch \u2014 no test exists |\n| 2 | Valid `amount` returns 201 with payment object | Happy path \u2014 completely untested |\n| 3 | `amount` is `0` (falsy) returns 400 | Edge case: `!amount` is `true` for `0`, a common monetary footgun |\n\n### Priority: High\n\n| # | Gap | Reason |\n|---|-----|--------|\n| 4 | `amount` is `null` returns 400 | Falsy value, explicit null from JSON body |\n| 5 | Response body shape is correct (`id`, `amount`) | Contract assertion \u2014 no structural test |\n| 6 | Response `amount` echoes back exactly the value sent | Data integrity \u2014 the returned `amount` comes directly from the body |\n\n### Priority: Medium\n\n| # | Gap | Reason |\n|---|-----|--------|\n| 7 | `amount` is a negative number | Domain validity \u2014 negative payments may be semantically invalid |\n| 8 | `amount` is a non-numeric string | Type coercion risk with `as { amount: number }` cast |\n| 9 | `amount` is `undefined` explicitly | Explicit undefined vs absent key \u2014 both hit `!amount` but worth confirming |\n\n---\n\n## Suggested Test Cases (Vitest / TypeScript)\n\n```ts\nimport { describe, it, expect } from 'vitest'\nimport type { FastifyRequest, FastifyReply } from 'fastify'\nimport { createPayment } from './payment.controller'\n\nfunction makeReply() {\n  const reply = {\n    _code: 0,\n    _body: undefined as unknown,\n    code(c: number) { this._code = c; return this },\n    send(b: unknown) { this._body = b; return this },\n  }\n  return reply\n}\n\nfunction makeRequest(body: unknown): FastifyRequest {\n  return { body } as FastifyRequest\n}\n\ndescribe('createPayment', () => {\n  describe('When amount is missing from the request body', () => {\n    it('Then it responds with 400 and an error message', async () => {\n      const req = makeRequest({})\n      const reply = makeReply()\n\n      await createPayment(req, reply as unknown as FastifyReply)\n\n      expect(reply._code).toBe(400)\n      expect(reply._body).toEqual({ error: 'amount required' })\n    })\n  })\n\n  describe('When amount is 0 (falsy numeric value)', () => {\n    it('Then it responds with 400 because 0 fails the !amount guard', async () => {\n      const req = makeRequest({ amount: 0 })\n      const reply = makeReply()\n\n      await createPayment(req, reply as unknown as FastifyReply)\n\n      expect(reply._code).toBe(400)\n      expect(reply._body).toEqual({ error: 'amount required' })\n    })\n  })\n\n  describe('When amount is null', () => {\n    it('Then it responds with 400', async () => {\n      const req = makeRequest({ amount: null })\n      const reply = makeReply()\n\n      await createPayment(req, reply as unknown as FastifyReply)\n\n      expect(reply._code).toBe(400)\n      expect(reply._body).toEqual({ error: 'amount required' })\n    })\n  })\n\n  describe('When a valid positive amount is provided', () => {\n    it('Then it responds with 201 and a payment object containing id and amount', async () => {\n      const req = makeRequest({ amount: 5000 })\n      const reply = makeReply()\n\n      await createPayment(req, reply as unknown as FastifyReply)\n\n      expect(reply._code).toBe(201)\n      expect(reply._body).toEqual({ id: 'pay_123', amount: 5000 })\n    })\n\n    it('Then the response echoes back the exact amount from the request', async () => {\n      const req = makeRequest({ amount: 9999 })\n      const reply = makeReply()\n\n      await createPayment(req, reply as unknown as FastifyReply)\n\n      expect((reply._body as { amount: number }).amount).toBe(9999)\n    })\n  })\n\n  describe('When amount is a negative number', () => {\n    it('Then it currently responds with 201 (documents missing domain validation)', async () => {\n      // NOTE: negative values pass through because -100 is truthy.\n      // This test documents current behavior; a future story should add domain validation.\n      const req = makeRequest({ amount: -100 })\n      const reply = makeReply()\n\n      await createPayment(req, reply as unknown as FastifyReply)\n\n      expect(reply._code).toBe(201)\n    })\n  })\n\n  describe('When amount is a non-numeric string', () => {\n    it('Then it currently responds with 201 because the string is truthy (type cast risk)', async () => {\n      // NOTE: documents a type-safety gap. The cast `as { amount: number }` does\n      // not validate at runtime, so strings pass the !amount guard.\n      const req = makeRequest({ amount: 'abc' })\n      const reply = makeReply()\n\n      await createPayment(req, reply as unknown as FastifyReply)\n\n      expect(reply._code).toBe(201)\n    })\n  })\n})\n```\n\n---\n\n## Notes\n\n1. **`!amount` footgun** \u2014 The guard `!amount` is falsy for `0`, `null`, `undefined`, `''`, and `false`. A payment of zero cents/pence will incorrectly return 400. The test for `amount: 0` above documents this as a **bug**, not desired behavior.\n\n2. **Type-cast risk** \u2014 `req.body as { amount: number }` is a compile-time assertion with no runtime validation. Any non-number truthy value will reach the use-case call. Consider adding a Zod or JSON Schema body validation to the Fastify route declaration.\n\n3. **Use-case is stubbed** \u2014 The comment `// calls use-case, writes to DB` indicates business logic is not yet implemented. Once wired, additional tests should cover use-case error paths (e.g., database failure \u2192 500).\n", "grading": {"expectations": [{"text": "Output contains TypeScript test syntax", "passed": true, "evidence": "describe/it blocks with When/Then naming throughout"}, {"text": "Output does NOT contain Go/Angular/Flutter syntax", "passed": true, "evidence": "0 matches for func Test, TestBed, testWidgets"}, {"text": "Identifies Critical or High gap for controller", "passed": true, "evidence": "3 Critical gaps identified for createPayment"}], "summary": {"pass_rate": 1.0, "passed": 3, "failed": 0, "total": 3}}, "timing": {"total_tokens": 17091, "duration_ms": 64586, "total_duration_seconds": 64.6}}}}, "2": {"id": 2, "metadata": {"eval_id": 2, "eval_name": "ts-angular-component-plus-controller", "prompt": "TS controller + Angular component. Verify TestBed for component, describe/it for controller.", "assertions": [{"text": "TestBed used for Angular component", "passed": null, "evidence": ""}, {"text": "describe/it used for controller", "passed": null, "evidence": ""}, {"text": "No syntax mixing", "passed": null, "evidence": ""}]}, "configs": {"with_skill": {"report": "## Coverage Gap Report\n\n2 files changed, 2 gaps found (1 critical, 0 high, 1 medium, 0 low)\n\n**Phase 0 detection script output:**\n```json\n{\"files\":{\"apps/frontend/user.component.ts\":\"typescript\",\"apps/server/user.controller.ts\":\"typescript\"},\"frameworks\":[\"angular\"],\"playwright\":false}\n```\nReferences loaded: `typescript.md` + `angular.md` (additive overlay).\n\n---\n\n### Phase 2: File Classification\n\n| File | Type | Applicable Exit Doors |\n|------|------|-----------------------|\n| `apps/frontend/user.component.ts` | Angular UI component | 1, 5 |\n| `apps/server/user.controller.ts` | HTTP controller | All 5 |\n\n### Phase 3: Existing Coverage\n\nNo test files found anywhere. Zero coverage.\n\n### Phase 4: Gap Classification ement.querySelector('h1')\n    expect(el.textContent).toContain('Alice')\n  })\n})\n```\n\n---\n\n### \u2705 Already Covered\n\nNone \u2014 no test files exist.\n\n### \u23ed\ufe0f Skipped\n\n- `apps/server/user.controller.ts` \u2014 Exit Door 2 (state): dropped \u2014 no persistence logic in source\n- `apps/server/user.controller.ts` \u2014 Exit Door 3 (external call): dropped \u2014 no external calls in source\n- `apps/server/user.controller.ts` \u2014 Exit Door 4 (queue events): dropped \u2014 no publish in source\n- `apps/server/user.controller.ts` \u2014 Exit Door 5 (error path): dropped \u2014 no error-handling logic in source\n- `apps/frontend/user.component.ts` \u2014 Exit Door 5 (error path): dropped \u2014 no error-handling logic in source\n\n---\n\n### Remediation Plan\n\n1. **[Critical]** Create `apps/server/user.controller.test.ts`. Write red test asserting `reply.send` called with user object. Replace stub with real lookup logic to make green.\n2. **[Medium]** Create `apps/frontend/user.component.spec.ts`. Use TestBed + `fixture.componentRef.setInput('name', ...)` + `detectChanges()`, assert `h1` text content.\n", "grading": {"expectations": [{"text": "TestBed used for Angular component", "passed": true, "evidence": "TestBed.configureTestingModule + componentRef.setInput + detectChanges shown"}, {"text": "describe/it used for controller", "passed": true, "evidence": "describe/it with When/Then naming for getUser controller"}, {"text": "No syntax mixing", "passed": true, "evidence": "Angular TestBed for component; plain describe/it for controller. No bleed. Exit Door 2/3/4/5 correctly dropped for stub controller."}], "summary": {"pass_rate": 1.0, "passed": 3, "failed": 0, "total": 3}}, "timing": {"total_tokens": 21147, "duration_ms": 83576, "total_duration_seconds": 83.6}}, "without_skill": {"report": "# Test Coverage Gap Report (baseline \u2014 no skill)\n\n## Files Analyzed\n\n- `apps/frontend/user.component.ts` \u2014 Angular component\n- `apps/serve onent]` for standalone components \u2014 Angular 17+ default. Skill version correct here too. Low-signal gaps: `selector is correct`, `send called once`, `id is a number`, `promise resolves` \u2014 these test framework behavior or trivial invariants, not user-visible behavior. Strength: input-change gap (Alice\u2192Bob) is genuinely useful. No Skipped/Remediation sections, no Exit Door taxonomy.", "timestamp": "2026-05-30T09:18:48.440Z"}, {"run_id": "eval-3-with_skill", "feedback": "Go-only output clean. `func Test*` naming \u2713, `httptest.NewRequest/NewRecorder` idiom \u2713, no TS leak. go.sum correctly skipped via SKIP_PATTERNS attribution (good provenance). Working Set phase explicit. Skipped Doors 2 + 4 with reason (no DB/queue in source). Concern: Gap 2 (gateway) proposes a source-code refactor \u2014 introduces `HandlePaymentWithGateway` + `stubGateway` that don't exist. Black-box principle says test the public interface as-is; if gateway isn't injectable, gap should be classified as 'requires refactor to test' or skipped, not silently rewritten. Remediation plan step 3 acknowledges it (`Make gateway injectable`), so framing is honest, but the test snippet should compile against actual source. Minor: error-path test on `MethodGet` assumes 405 \u2014 the source may return 200 for any method (no check); test would fail. Document as expected-vs-actual.", "timestamp": "2026-05-30T09:18:48.440Z"}, {"run_id": "eval-3-without_skill", "feedback": "WITHOUT-SKILL Go. `func Test*` \u2713 (4 funcs), no TS leak. go.sum mentioned only in top note + missing-from-subject footnote \u2014 no dedicated Skipped section, weaker provenance than skill. Strengths: idiomatic Go \u2014 table-driven method test, context-cancellation test, body+Content-Type test. Public Interface table is nice. Weaknesses: C1/C2 are the same gap split in two (double-count). L2 `route registration` is integration scope, not unit. Cancellation test `ThenDoesNotPanic` has no `t.Errorf` \u2014 only catche ual tests). What tests should I write? Use the smart-coverage skill to analyze the gaps.", "assertions": [{"text": "Output contains TypeScript test syntax", "passed": null, "evidence": ""}, {"text": "Output does NOT contain Go/Angular/Flutter syntax", "passed": null, "evidence": ""}, {"text": "Identifies Critical or High gap for controller", "passed": null, "evidence": ""}]}, "configs": {"with_skill": {"report": "## Coverage Gap Report\n\n1 file changed, 3 gaps found (0 critical, 3 high, 0 medium, 0 low)\n\n---\n\n### Phase 0\n\nDetection output: `{\"files\":{\"apps/server/payment.controller.ts\":\"typescript\",\"apps/server/payment.controller.test.ts\":\"typescript\"},\"frameworks\":[],\"playwright\":false}`\nReferences loaded: `typescript.md` + `testing-principles.md`. No overlays.\n\n---\n\n### Phase 2: File Classification\n\n| File | Type | Applicable Exit Doors |\n|------|------|-----------------------|\n| `apps/server/payment.controller.ts` | HTTP controller (Fastify) | 1, 2, 3, 4, 5 |\n\n---\n\n### Phase 3: Existing Coverage\n\nCo-located test file `apps/server/payment.controller.test.ts` contains only `describe('createPayment', () => {})` \u2014 zero actual tests.\n\n---\n\n### \ud83d\udd34 Critical\n\n_None._\n\n---\n\n### \ud83d\udfe0 High\n\n**`apps/server/payment.controller.ts`**\n\nGap 1 \u2014 Happy-path response (Exit Door 1)\n\n```typescript\ndescribe('createPayment', () => {\n  it('When valid amount and currency, Then responds 201 with id and amount', async () => {\n    // Arrange\n    const app = buildTestApp() // register POST /payments route\n    // Act\n    const response = await app.inject({\n      method: 'POST',\n      url: '/payments',\n      payload: { amount: 100, currency: 'USD' },\n    })\n    // Assert\n    expect(response.statusCode).toBe(201)\n    expect(response.json()).toMatchObject({ id: expect.any(String), amount: 100 })\n  })\n})\n```\n\nGap 2 \u2014 Validation error path: amount = 0 or negative (Exit Door 5)\n\n```typescript\ndescribe('createPayment', () => {\n  it('When amount is 0, Then responds 400 with error message', async () => {\n    // Arrange\n    const app = buildTestApp()\n    // Act\n    const response = await app.inject({\n      method: 'POST',\n      url: '/payments',\n      payload: { amount: 0, currency: 'USD' },\n    })\n    // Assert\n    expect(response.statusCode).toBe(400)\n    expect(response.json()).toEqual({ error: 'Invalid amount' })\n  })\n\n  it('When amount is negative, Then responds 400 with error message', async () => {\n    // Arrange\n    const app = buildTestApp()\n    // Act\n    const response = await app.inject({\n      method: 'POST',\n      url: '/payments',\n      payload: { amount: -50, currency: 'USD' },\n    })\n    // Assert\n    expect(response.statusCode).toBe(400)\n    expect(response.json()).toEqual({ error: 'Invalid amount' })\n  })\n})\n```\n\nGap 3 \u2014 Use-case called with correct args (Exit Door 3) `[REQUIRES REFACTOR]`\n\n`paymentUseCase` is a free variable in the current source \u2014 not passed via parameter, factory, or Fastify plugin option. There is no public seam to verify the call without modifying source.\n\n**Required refactor:** Accept `paymentUseCase` as an explicit dependency \u2014 e.g. `buildCreatePaymentHandler(paymentUseCase)` or Fastify plugin options \u2014 so tests can inject a recording stub.\n\nOnce the seam exists:\n\n```typescript\ndescribe('createPayment', () => {\n  it('When valid payload, Then calls use-case with amount and currency', async () => {\n    // Arrange\n    const executeSpy = vi.fn().mockResolvedValue({ id: 'pay-1', amount: 100 })\n    const app = buildTestApp({ paymentUseCase: { execute: executeSpy } })\n    // Act\n    await app.inject({\n      method: 'POST',\n      url: '/payments',\n      payload: { amount: 100, currency: 'USD' },\n    })\n    // Assert\n    expect(executeSpy).toHaveBeenCalledWith({ amount: 100, currency: 'USD' })\n  })\n})\n```\n\n---\n\n### \ud83d\udfe1 Medium\n\n_None._\n\n---\n\n### \ud83d\udfe2 Low\n\n_None._\n\n---\n\n### \u2705 Already Covered\n\n_None \u2014 no exit doors covered by the existing placeholder test file._\n\n---\n\n### \u23ed\ufe0f Skipped\n\n- `apps/server/payment.controller.ts` \u2014 Exit Door 2 (state): dropped \u2014 no persistence logic in source; handler delegates to use-case and returns its result.\n- `apps/server/payment.controller.ts` \u2014 Exit Door 4 (queue events): dropped \u2014 no message-queue publish in source.\n- `apps/server/payment.controller.test.ts` \u2014 test file; excluded from working set per TEST_PATTERN filter.\n\n---\n\n### Remediation Plan\n\n1. **[High \u2014 Gap 2]** Add tests for the validation error path (amount = 0, amount < 0) using `app.inject()`. No source changes needed.\n2. **[High \u2014 Gap 3 \u2014 REQUIRES REFACTOR]** Refactor `payment.controller.ts` to accept `paymentUseCase` as an explicit dependency (factory or Fastify plugin options). Then add test asserting `execute` called with `{ amount, currency }`.\n3. **[High \u2014 Gap 1]** Add happy-path test asserting 201 + `{ id, amount }`. Unblocked once Gap 3 refactor provides the injectable seam.\n", "grading": {"expectations": [{"text": "Output contains TypeScript test syntax", "passed": true, "evidence": "Report contains describe/it/expect blocks with TypeScript syntax throughout all three suggested test snippets"}, {"text": "Output does NOT contain Go/Angular/Flutter syntax", "passed": true, "evidence": "Report is entirely TypeScript; no Go func Test*, no TestBed, no Flutter widget test patterns appear anywhere"}, {"text": "Identifies Critical or High gap for controller", "passed": true, "evidence": "Three High gaps identified for apps/server/payment.controller.ts covering happy-path, amount=0 validation, and use-case call seam"}, {"text": "Uses app.inject() pattern (not mockReply/vi.fn() mocks for HTTP layer)", "passed": true, "evidence": "All three suggested test snippets use app.inject({ method, url, payload }) for HTTP simulation; no mockReply or raw vi.fn() on reply object"}, {"text": "Handles amount=0 falsy edge case", "passed": true, "evidence": "Gap 2 explicitly includes a test case with payload { amount: 0, currency: 'USD' } asserting 400 response"}], "summary": {"pass_rate": 1.0, "passed": 5, "failed": 0, "total": 5}}, "timing": {"total_tokens": 26481, "duration_ms": 121605, "total_duration_seconds": 121.6}}, "without_skill": {"report": "# Test Coverage Gap Report: `payment.controller.ts`\n\n## Summary\n\nThe `createPayment` controller has **zero existing tests**. The function is a Fastify route handler that validates an `amount` field from the request body, then returns a created payment response. All branches and behaviors are untested.\n\n---\n\n## Public Interface Under Test\n\n```ts\nexport async function createPayment(req: FastifyRequest, reply: FastifyReply): Promise<void>\n```\n\n---\n\n## Coverage Gaps\n\n### Priority: Critical\n\n| # | Gap | Reason |\n|---|-----|--------|\n| 1 | Missing `amount` in request body returns 400 | Core validation branch \u2014 no test exists |\n| 2 | Valid `amount` returns 201 with payment object | Happy path \u2014 completely untested |\n| 3 | `amount` is `0` (falsy) returns 400 | Edge case: `!amount` is `true` for `0`, a common monetary footgun |\n\n### Priority: High\n\n| # | Gap | Reason |\n|---|-----|--------|\n| 4 | `amount` is `null` returns 400 | Falsy value, explicit null from JSON body |\n| 5 | Response body shape is correct (`id`, `amount`) | Contract assertion \u2014 no structural test |\n| 6 | Response `amount` echoes back exactly the value sent | Data integrity \u2014 the returned `amount` comes directly from the body |\n\n### Priority: Medium\n\n| # | Gap | Reason |\n|---|-----|--------|\n| 7 | `amount` is a negative number | Domain validity \u2014 negative payments may be semantically invalid |\n| 8 | `amount` is a non-numeric string | Type coercion risk with `as { amount: number }` cast |\n| 9 | `amount` is `undefined` explicitly | Explicit undefined vs absent key \u2014 both hit `!amount` but worth confirming |\n\n---\n\n## Suggested Test Cases (Vitest / TypeScript)\n\n```ts\nimport { describe, it, expect } from 'vitest'\nimport type { FastifyRequest, FastifyReply } from 'fastify'\nimport { createPayment } from './payment.controller'\n\nfunction makeReply() {\n  const reply = {\n    _code: 0,\n    _body: undefined as unknown,\n    code(c: number) { this._code = c; return this },\n    send(b: unknown) { this._body = b; return this },\n  }\n  return reply\n}\n\nfunction makeRequest(body: unknown): FastifyRequest {\n  return { body } as FastifyRequest\n}\n\ndescribe('createPayment', () => {\n  describe('When amount is missing from the request body', () => {\n    it('Then it responds with 400 and an error message', async () => {\n      const req = makeRequest({})\n      const reply = makeReply()\n\n      await createPayment(req, reply as unknown as FastifyReply)\n\n      expect(reply._code).toBe(400)\n      expect(reply._body).toEqual({ error: 'amount required' })\n    })\n  })\n\n  describe('When amount is 0 (falsy numeric value)', () => {\n    it('Then it responds with 400 because 0 fails the !amount guard', async () => {\n      const req = makeRequest({ amount: 0 })\n      const reply = makeReply()\n\n      await createPayment(req, reply as unknown as FastifyReply)\n\n      expect(reply._code).toBe(400)\n      expect(reply._body).toEqual({ error: 'amount required' })\n    })\n  })\n\n  describe('When amount is null', () => {\n    it('Then it responds with 400', async () => {\n      const req = makeRequest({ amount: null })\n      const reply = makeReply()\n\n      await createPayment(req, reply as unknown as FastifyReply)\n\n      expect(reply._code).toBe(400)\n      expect(reply._body).toEqual({ error: 'amount required' })\n    })\n  })\n\n  describe('When a valid positive amount is provided', () => {\n    it('Then it responds with 201 and a payment object containing id and amount', async () => {\n      const req = makeRequest({ amount: 5000 })\n      const reply = makeReply()\n\n      await createPayment(req, reply as unknown as FastifyReply)\n\n      expect(reply._code).toBe(201)\n      expect(reply._body).toEqual({ id: 'pay_123', amount: 5000 })\n    })\n\n    it('Then the response echoes back the exact amount from the request', async () => {\n      const req = makeRequest({ amount: 9999 })\n      const reply = makeReply()\n\n      await createPayment(req, reply as unknown as FastifyReply)\n\n      expect((reply._body as { amount: number }).amount).toBe(9999)\n    })\n  })\n\n  describe('When amount is a negative number', () => {\n    it('Then it currently responds with 201 (documents missing domain validation)', async () => {\n      // NOTE: negative values pass through because -100 is truthy.\n      // This test documents current behavior; a future story should add domain validation.\n      const req = makeRequest({ amount: -100 })\n      const reply = makeReply()\n\n      await createPayment(req, reply as unknown as FastifyReply)\n\n      expect(reply._code).toBe(201)\n    })\n  })\n\n  describe('When amount is a non-numeric string', () => {\n    it('Then it currently responds with 201 because the string is truthy (type cast risk)', async () => {\n      // NOTE: documents a type-safety gap. The cast `as { amount: number }` does\n      // not validate at runtime, so strings pass the !amount guard.\n      const req = makeRequest({ amount: 'abc' })\n      const reply = makeReply()\n\n      await createPayment(req, reply as unknown as FastifyReply)\n\n      expect(reply._code).toBe(201)\n    })\n  })\n})\n```\n\n---\n\n## Notes\n\n1. **`!amount` footgun** \u2014 The guard `!amount` is falsy for `0`, `null`, `undefined`, `''`, and `false`. A payment of zero cents/pence will incorrectly return 400. The test for `amount: 0` above documents this as a **bug**, not desired behavior.\n\n2. **Type-cast risk** \u2014 `req.body as { amount: number }` is a compile-time assertion with no runtime validation. Any non-number truthy value will reach the use-case call. Consider adding a Zod or JSON Schema body validation to the Fastify route declaration.\n\n3. **Use-case is stubbed** \u2014 The comment `// calls use-case, writes to DB` indicates business logic is not yet implemented. Once wired, additional tests should cover use-case error paths (e.g., database failure \u2192 500).\n", "grading": {"expectations": [{"text": "Output contains TypeScript test syntax", "passed": true, "evidence": "describe/it blocks with When/Then naming throughout"}, {"text": "Output does NOT contain Go/Angular/Flutter syntax", "passed": true, "evidence": "0 matches for func Test, TestBed, testWidgets"}, {"text": "Identifies Critical or High gap for controller", "passed": true, "evidence": "3 Critical gaps identified for createPayment"}], "summary": {"pass_rate": 1.0, "passed": 3, "failed": 0, "total": 3}}, "timing": {"total_tokens": 17091, "duration_ms": 64586, "total_duration_seconds": 64.6}}}}, "2": {"id": 2, "metadata": {"eval_id": 2, "eval_name": "ts-angular-component-plus-controller", "prompt": "I modified two files: apps/server/user.controller.ts (an HTTP route handler) and apps/frontend/user.component.ts (an Angular component). What tests do I need? Use smart-coverage.", "assertions": [{"text": "TestBed used for Angular component", "passed": null, "evidence": ""}, {"text": "describe/it used for controller", "passed": null, "evidence": ""}, {"text": "No syntax mixing", "passed": null, "evidence": ""}]}, "configs": {"with_skill": {"report": "## Coverage Gap Report\n\n2 files changed, 3 gaps found (1 critical, 1 high, 1 medium, 0 low)\n\n---\n\n### Phase 0\n\nDetection output: `{\"files\":{\"apps/server/user.controller.ts\":\"typescript\",\"apps/frontend/user.component.ts\":\"typescript\"},\"frameworks\":[\"angular\"],\"playwright\":false}`\nReferences loaded: `typescript.md` + `angular.md` (overlay) + `testing-principles.md`.\n\n---\n\n### Phase 2: File Classification\n\n| File | Type | Applicable Exit Doors |\n|------|------|-----------------------|\n| `apps/server/user.controller.ts` | HTTP controller (Fastify) | All 5 |\n| `apps/frontend/user.component.ts` | UI component (Angular standalone) | 1, 5 |\n\n---\n\n### \ud83d\udd34 Critical\n\n**`apps/server/user.controller.ts`**\n\n- Missing: Exit Door 1 \u2014 HTTP response (no test file exists at all for this route handler)\n- Suggested:\n\n```typescript\nimport Fastify from 'fastify'\n\ndescribe('getUser', () => {\n  it('When a valid user id is requested, Then responds 200 with the user object', async () => {\n    // Arrange\n    const app = Fastify()\n    app.get('/users/:id', getUser)\n    await app.ready()\n\n    // Act\n    const response = await app.inject({\n      method: 'GET',\n      url: '/users/1',\n    })\n\n    // Assert\n    expect(response.statusCode).toBe(200)\n    expect(JSON.parse(response.body)).toMatchObject({ id: 1 })\n  })\n})\n```\n\n---\n\n### \ud83d\udfe0 High\n\n**`apps/server/user.controller.ts`**\n\nGap 1 \u2014 error path: user not found or invalid id param (Exit Door 5)\n\n```typescript\ndescribe('getUser error paths', () => {\n  it('When a non-existent user id is requested, Then responds with 404', async () => {\n    // Arrange\n    const app = Fastify()\n    app.get('/users/:id', getUser)\n    await app.ready()\n\n    // Act\n    const response = await app.inject({ method: 'GET', url: '/users/99999' })\n\n    // Assert\n    expect(response.statusCode).toBe(404)\n  })\n\n  it('When a non-numeric user id is provided, Then responds with 400', async () => {\n    // Arrange\n    const app = Fastify()\n    app.get('/users/:id', getUser)\n    await app.ready()\n\n    // Act\n    const response = await app.inject({ method: 'GET', url: '/users/not-a-number' })\n\n    // Assert\n    expect(response.statusCode).toBe(400)\n  })\n})\n```\n\n---\n\n### \ud83d\udfe1 Medium\n\n**`apps/frontend/user.component.ts`**\n\nGap ;\n    expect(body).toHaveProperty('orderId');\n    expect(typeof body.orderId).toBe('string');\n    expect(body.orderId).not.toBe('');\n  });\n\n  test('returns a consistent orderId shape across multiple calls', async ({ request }) => {\n    const r1 = await request.post('/checkout', { data: { cartId: 'cart_1' } });\n    const r2 = await request.post('/checkout', { data: { cartId: 'cart_2' } });\n\n    expect(r1.status()).toBe(200);\n    expect(r2.status()).toBe(200);\n\n    const b1 = await r1.json();\n    const b2 = await r2.json();\n\n    expect(b1).toHaveProperty('orderId');\n    expect(b2).toHaveProperty('orderId');\n  });\n\n  test('returns 400 when cartId is missing', async ({ request }) => {\n    const response = await request.post('/checkout', { data: {} });\n    expect(response.status()).toBe(400);\n  });\n\n  test('returns 400 when cartId is empty string', async ({ request }) => {\n    const response = await request.post('/checkout', { data: { cartId: '' } });\n    expect(response.status()).toBe(400);\n  });\n\n  test('returns 404 when cartId does not exist', async ({ request }) => {\n    const response = await request.post('/checkout', {\n      data: { cartId: 'nonexistent_cart_99999' },\n    });\n    // Once real persistence is added, unknown carts should yield 404\n    expect([404, 200]).toContain(response.status());\n  });\n});\n```\n\n### E2E Priority\n\n| Gap | Priority |\n|-----|----------|\n| Happy path: valid cartId \u2192 200 + orderId | Critical |\n| Missing cartId \u2192 400 | High |\n| Empty cartId \u2192 400 | High |\n| Unknown cartId \u2192 404 (post-stub) | Medium |\n| Response shape stability across calls | Low |\n\n---\n\n## Notes\n\n- The current implementation is a stub (`return { orderId: 'ord_1' }`). Many gaps above will only become meaningful once real checkout logic (cart lookup, order creation, persistence) is added.\n- The E2E tests assume a route `POST /checkout` exists in the server and that the `baseURL` is configured in `pla  #2 is a **strict superset** of #1, #3, and #4:\n\n| Test | Asserts | Subsumed by #2? |\n|------|---------|------|\n| #1 \"When valid order, Then returns 201\" | `statusCode === 201` | Yes \u2014 #2 asserts the same plus body + repo call. |\n| #3 \"When order posted, Then repo.save called once\" | `repo.save` called 1x | Yes \u2014 #2's `toHaveBeenCalledWith(...)` implies called once with exact args. Also low-signal: asserts framework wiring, not business logic. |\n| #4 \"When user posts an order, Then status is 201\" | `statusCode === 201` | Yes \u2014 identical assertion to #1, just different `userId`/`sku`. Pure duplicate of #1. |\n\n**Recommendation: delete #1, #3, #4.** Keep #2 as the canonical happy-path test. None of the deleted tests covers a branch or value that #2 doesn't already cover.\n\n### Quick-win replacement suite\nReplace the three redundant tests with tests that close the real gaps:\n\n```ts\nit('When userId is empty, Then returns 400', async () => { /* G1 */ });\nit('When items is empty, Then returns 400 and does not call repo.save', async () => { /* G2 */ });\nit('When repo.save rejects, Then error propagates', async () => { /* G3 */ });\n```\n\n## Summary\n\n- **Redundancy:** 3 of 4 tests are redundant (#1, #3, #4 all subsumed by #2).\n- **Coverage:** the 400-branch is entirely untested; error path from `repo.save` is untested.\n- **Net effect:** file looks well-tested by test count, but effective branch coverage is ~50% and there is significant duplicated assertion work.\n\nFiles reviewed:\n- `apps/server/order.controller.ts`\n- `apps/server/order.controller.test.ts`\n", "grading": null, "timing": {"total_tokens": 15507, "duration_ms": 27585, "total_duration_seconds": 27.6}}}}, "8": {"id": 8, "metadata": {"eval_id": 8, "eval_name": "go-dead-tests", "prompt": "I modified billing/billing.go \u2014 I deleted ProcessRefund and renamed CalculateTax to ComputeTax. The existing billing/billing_test.go still references the old names. Use smart-coverage."}, "configs": {"iter4_skill": {"report": null, "grading": null, "timing": null}, "with_skill": {"report": "## Coverage Gap Report\n\n1 file changed, 5 gaps found (0 critical, 4 high, 1 medium, 0 low) + 4 redundant.\n\n### Phase 2 \u2014 File Classification\n\n| File | Type | Applicable Exit Doors |\n|------|------|-----------------------|\n| `billing/billing.go` | Pure utility | 1 (response); 5 (error path) via returned `error` |\n\n### \ud83d\udd34 Critical\n_None._\n\n### \ud83d\udfe0 High\n\n**`billing/billing.go`**\n\nGap 1 \u2014 `ComputeTax` happy path under new name (Exit Door 1). After the rename, no live test exercises `ComputeTax`; the package will not even compile.\n```go\nfunc TestComputeTax_WhenValidInputs_ThenReturnsSubtotalTimesRate(t *testing.T) {\n    // Arrange\n    subtotal, rate := 100.0, 0.1\n    // Act\n    got, err := ComputeTax(subtotal, rate)\n    // Assert\n    if err != nil { t.Fatalf(\"unexpected error: %v\", err) }\n    if got != 10.0 { t.Errorf(\"got %v, want 10.0\", got) }\n}\n```\n\nGap 2 \u2014 Rejects negative subtotal (Exit Door 5). Source: `if subtotal < 0 { return 0, errors.New(...) }`.\n```go\nfunc TestComputeTax_WhenSubtotalNegative_ThenReturnsError(t *testing.T) {\n    got, err := ComputeTax(-1.0, 0.1)\n    if err == nil { t.Fatal(\"expected error for negative subtotal\") }\n    if got != 0 { t.Errorf(\"got %v, want 0 on error\", got) }\n}\n```\n\nGap 3 \u2014 Rejects rate below 0 (Exit Door 5). Old tests only covered `rate > 1`; the `rate < 0` branch is uncovered.\n```go\nfunc TestComputeTax_WhenRateNegative_ThenReturnsError(t *testing.T) {\n    got, err := ComputeTax(100.0, -0.01)\n    if err == nil { t.Fatal(\"expected error for negative rate\") }\n    if got != 0 { t.Errorf(\"got %v, want 0 on error\", got) }\n}\n```\n\nGap 4 \u2014 Rejects rate above 1 (Exit Door 5). The old assertion is DEAD and must be re-established under the new symbol.\n```go\nfunc TestComputeTax_WhenRateAboveOne_ThenReturnsError(t *testing.T) {\n    got, err := ComputeTax(100.0, 1.5)\n    if err == nil { t.Fatal(\"expected error for rate > 1\") }\n    if got != 0 { t.Errorf(\"got %v, want 0 on error\", got) }\n}\n```\n\n### \ud83d\udfe1 Medium\n\n**`billing/billing.go`**\n\nGap 5 \u2014 Inclusive boundary at `rate == 0`, `rate == 1`, `subtotal == 0` (Exit Door 1). Source uses inclusive bounds (`rate < 0 || rate > 1`); lock in inclusive behavior.\n```go\nfunc TestComputeTax_BoundaryInputs(t *testing.T) {\n    tests := []struct{\n        name     string\n        subtotal float64\n        rate     float64\n        want     float64\n    }{\n        {\"When rate is exactly 0, Then returns 0 with no error\", 100.0, 0.0, 0.0},\n        {\"When rate is exactly 1, Then returns subtotal with no error\", 100.0, 1.0, 100.0},\n        {\"When subtotal is exactly 0, Then returns 0 with no error\", 0.0, 0.5, 0.0},\n    }\n    for _, tt := range tests {\n        t.Run(tt.name, func(t *testing.T) {\n            got, err := ComputeTax(tt.subtotal, tt.rate)\n            if err != nil { t.Fatalf(\"unexpected error: %v\", err) }\n            if got != tt.want { t.Errorf(\"got %v, want %v\", got, tt.want) }\n        })\n    }\n}\n```\n\n### \ud83d\udfe2 Low\n_None._\n\n### \u2705 Already Covered\n_None._ All prior tests reference symbols that no longer exist \u2014 effective live coverage of `billing/billing.go` is zero.\n\n### \ud83d\udd01 Redundant Tests\n\n- `billing/billing_test.go::TestCalculateTax_WhenValid_ThenReturnsTax` \u2014 [DEAD] `CalculateTax` renamed to `ComputeTax`. Human review: **rename** to `TestComputeTax_WhenValid_ThenReturnsTax` and update the call site \u2014 the assertion is still valuable (it becomes Gap 1).\n- `billing/billing_test.go::TestCalculateTax_WhenRateOutOfRange_ThenReturnsError` \u2014 [DEAD] `CalculateTax` renamed to `ComputeTax`. Human review: **rename** to `TestComputeTax_WhenRateAboveOne_ThenReturnsError` and update the call site \u2014 the assertion becomes Gap 4.\n- `billing/billing_test.go::TestProcessRefund_WhenValid_ThenNoError` \u2014 [DEAD] `ProcessRefund` removed from source. Human review: **delete** \u2014 no replacement symbol to retarget.\n- `billing/billing_test.go::TestProcessRefund_WhenAmountZero_ThenReturnsError` \u2014 [DEAD] `ProcessRefund` removed from source. Human review: **delete** \u2014 no replacement symbol to retarget.\n\nThe package will not compile while these four tests remain, so the entire `billing` test binary is currently broken; fixing the DEAD tests is a prerequisite for the other gap fixes to execute.\n\n### \u23ed\ufe0f Skipped\n- `go.mod` \u2014 module manifest, not in diff and has no exit doors.\n\n### Remediation Plan\n\n1. Resolve the four DEAD tests in `billing/billing_test.go` so the package compiles:\n   a. Rename `TestCalculateTax_WhenValid_ThenReturnsTax` \u2192 `TestComputeTax_WhenValid_ThenReturnsTax`, switch the call to `ComputeTax(...)` (covers Gap 1).\n   b. Rename `TestCalculateTax_WhenRateOutOfRange_ThenReturnsError` \u2192 `TestComputeTax_WhenRateAboveOne_ThenReturnsError`, switch the call to `ComputeTax(...)` (covers Gap 4).\n   c. Delete `TestProcessRefund_WhenValid_ThenNoError`.\n   d. Delete `TestProcessRefund_WhenAmountZero_ThenReturnsError`.\n2. Add `TestComputeTax_WhenSubtotalNegative_ThenReturnsError` (Gap 2 \u2014 Exit Door 5).\n3. Add `TestComputeTax_WhenRateNegative_ThenReturnsError` (Gap 3 \u2014 Exit Door 5).\n4. Add `TestComputeTax_BoundaryInputs` table-driven test for inclusive bounds (Gap 5 \u2014 Exit Door 1).\n", "grading": null, "timing": {"total_tokens": 36131, "duration_ms": 134386, "total_duration_seconds": 134.4}}, "without_skill": {"report": "# Smart Coverage Review \u2014 `billing/` after refactor\n\n## Summary of the diff (as described)\n- `ProcessRefund` was **deleted** from `billing/billing.go`.\n- `CalculateTax` was **renamed to `ComputeTax`** (signature unchanged: `(subtotal, rate float64) (float64, error)`).\n\n`billing/billing.go` now only exports a single function: `ComputeTax`. No other files in the module reference the removed/renamed symbols \u2014 only `billing_test.go` does. So all decisions are local to that test file.\n\n## Dead vs. salvageable tests in `billing/billing_test.go`\n\n| Test | Status | Reason | Action |\n|---|---|---|---|\n| `TestCalculateTax_WhenValid_ThenReturnsTax` (L5\u201313) | **Salvage \u2014 rename** | Same function, just renamed. Test logic is still valid against `ComputeTax`. | Rename test + update call site. |\n| `TestCalculateTax_WhenRateOutOfRange_ThenReturnsError` (L15\u201319) | **Salvage \u2014 rename** | Same as above; still meaningful behavior. | Rename test + update call site. |\n| `TestProcessRefund_WhenValid_ThenNoError` (L21\u201325) | **Dead \u2014 delete** | `ProcessRefund` no longer exists. The behavior it covered is gone from the package. | Delete the test. |\n| `TestProcessRefund_WhenAmountZero_ThenReturnsError` (L27\u201331) | **Dead \u2014 delete** | Same \u2014 covers a removed function. | Delete the test. |\n\nWithout these changes, `go test ./billing/...` will fail to compile (`undefined: CalculateTax`, `undefined: ProcessRefund`).\n\n## Concrete patch\n\nReplace `billing/billing_test.go` with:\n\n```go\npackage billing\n\nimport \"testing\"\n\nfunc TestComputeTax_WhenValid_ThenReturnsTax(t *testing.T) {\n    got, err := ComputeTax(100.0, 0.1)\n    if err != nil {\n        t.Fatalf(\"unexpected error: %v\", err)\n    }\n    if got != 10.0 {\n        t.Errorf(\"got %v, want 10.0\", got)\n    }\n}\n\nfunc TestComputeTax_WhenRateOutOfRange_ThenReturnsError(t *testing.T) {\n    if _, err := ComputeTax(100.0, 1.5); err == nil {\n        t.Error(\"expected error for rate > 1\")\n    }\n}\n```\n\n(Both `ProcessRefund` tests removed; both `CalculateTax` tests renamed and re-pointed at `ComputeTax`.)\n\n## Coverage gaps in `ComputeTax`\n\nEven after the rename, the existing tests under-cover the function. `ComputeTax` has three branches:\n\n1. `subtotal < 0` \u2192 error  *(not covered)*\n2. `rate < 0 || rate > 1` \u2192 error  *(only `rate > 1` is covered; `rate < 0` is not)*\n3. happy path \u2192 `subtotal * rate`  *(covered)*\n\nSuggested additional tests to close the gaps:\n\n```go\nfunc TestComputeTax_WhenSubtotalNegative_ThenReturnsError(t *testing.T) {\n    if _, err := ComputeTax(-1.0, 0.1); err == nil {\n        t.Error(\"expected error for negative subtotal\")\n    }\n}\n\nfunc TestComputeTax_WhenRateNegative_ThenReturnsError(t *testing.T) {\n    if _, err := ComputeTax(100.0, -0.1); err == nil {\n        t.Error(\"expected error for negative rate\")\n    }\n}\n```\n\nOptional edge cases worth considering (low priority): `rate == 0`, `rate == 1`, `subtotal == 0` \u2014 these are valid inputs per the guards and would lock in boundary behavior.\n\n## Repo-wide check\nGrepped the whole module for `ProcessRefund`, `CalculateTax`, and `ComputeTax`. The only non-test reference outside `billing.go` is none \u2014 nothing else in this repo imports or calls these symbols, so no downstream callers need updating.\n\n## Recommended actions, in order\n1. Delete the two `TestProcessRefund_*` tests (dead).\n2. Rename the two `TestCalculateTax_*` tests to `TestComputeTax_*` and update the call sites (`CalculateTax` \u2192 `ComputeTax`).\n3. Add `TestComputeTax_WhenSubtotalNegative_ThenReturnsError` and `TestComputeTax_WhenRateNegative_ThenReturnsError` to cover the two missed error branches.\n4. Run `go test ./...` to confirm green.\n\n## Relevant file paths\n- `billing/billing.go`\n- `billing/billing_test.go`\n", "grading": null, "timing": {"total_tokens": 16301, "duration_ms": 43310, "total_duration_seconds": 43.3}}}}, "9": {"id": 9, "metadata": {"eval_id": 9, "eval_name": "go-speculative-api", "prompt": "I added api/orders/handler.go with HandleOrder that calls a package-level chargeCard function (no interface, no DI, hardcoded HTTPS endpoint). What tests should I write? Use smart-coverage."}, "configs": {"iter4_skill": {"report": null, "grading": null, "timing": null}, "with_skill": {"report": "## Coverage Gap Report\n1 file changed, 6 gaps found (1 critical, 5 high, 0 medium, 0 low) + 0 redundant\n\n### \ud83d\udd34 Critical\n**`api/orders/handler.go`**\n- Missing: HTTP route has no test file at all (`api/orders/handler_test.go` absent). `HandleOrder` is a new public HTTP handler with branching logic and zero coverage.\n- Suggested: bootstrap `api/orders/handler_test.go` with the table-driven sketches below (start with the happy-path 201 sketch under High \u2192 Gap 1).\n\n### \ud83d\udfe0 High\n**`api/orders/handler.go`**\n\nGap 1 \u2014 Happy path returns 201 with Content-Type json (Exit Door 1)\n```go\nfunc TestHandleOrder_WhenValidPost_ThenReturns201(t *testing.T) {\n    // Arrange\n    body := strings.NewReader(`{\"user_id\":\"u1\",\"amount\":12.5}`)\n    req := httptest.NewRequest(http.MethodPost, \"/orders\", body)\n    rr := httptest.NewRecorder()\n\n    // Act\n    HandleOrder(rr, req)\n\n    // Assert\n    // NOTE: with the current source, this assertion depends on the live\n    // https://payments.example.com/charge endpoint. Until chargeCard is\n    // made substitutable (see Gap 5), this test will be flaky or fail in\n    // CI. Asserting status + Content-Type is the most that can be done\n    // without a refactor; body shape requires the refactor in Gap 5.\n    if rr.Code != http.StatusCreated {\n        t.Fatalf(\"status: got %d, want 201\", rr.Code)\n    }\n    if ct := rr.Header().Get(\"Content-Type\"); ct != \"application/json\" {\n        t.Errorf(\"content-type: got %q, want application/json\", ct)\n    }\n}\n```\n\nGap 2 \u2014 Non-POST method returns 405 (Exit Door 5)\n```go\nfunc TestHandleOrder_WhenMethodNotPost_ThenReturns405(t *testing.T) {\n    tests := []struct {\n        name   string\n        method string\n    }{\n        {\"When GET, Then 405\", http.MethodGet},\n        {\"When PUT, Then 405\", http.MethodPut},\n        {\"When DELETE, Then 405\", http.MethodDelete},\n    }\n    for _, tt := range tests {\n        t.Run(tt.name, func(t *testing.T) {\n            // Arrange\n            req := httptest.NewRequest(tt.method, \"/orders\", nil)\n            rr := httptest.NewRecorder()\n\n            // Act\n            HandleOrder(rr, req)\n\n            // Assert\n            if rr.Code != http.StatusMethodNotAllowed {\n                t.Errorf(\"got %d, want 405\", rr.Code)\n            }\n        })\n    }\n}\n```\n\nGap 3 \u2014 Malformed JSON body returns 400 (Exit Door 5)\n```go\nfunc TestHandleOrder_WhenBodyNotJSON_ThenReturns400(t *testing.T) {\n    // Arrange\n    req := httptest.NewRequest(http.MethodPost, \"/orders\", strings.NewReader(`{not json`))\n    rr := httptest.NewRecorder()\n\n    // Act\n    HandleOrder(rr, req)\n\n    // Assert\n    if rr.Code != http.StatusBadRequest {\n        t.Fatalf(\"got %d, want 400\", rr.Code)\n    }\n}\n```\n\nGap 4 \u2014 Empty user_id or non-positive amount returns 400 (Exit Door 1, falsy/boundary blind spot)\n```go\nfunc TestHandleOrder_WhenValidationFails_ThenReturns400(t *testing.T) {\n    tests := []struct {\n        name string\n        body string\n    }{\n        {\"When user_id empty, Then 400\", `{\"user_id\":\"\",\"amount\":10}`},\n        {\"When amount zero, Then 400\", `{\"user_id\":\"u1\",\"amount\":0}`},\n        {\"When amount negative, Then 400\", `{\"user_id\":\"u1\",\"amount\":-1}`},\n    }\n    for _, tt := range tests {\n        t.Run(tt.name, func(t *testing.T) {\n            // Arrange\n            req := httptest.NewRequest(http.MethodPost, \"/orders\", strings.NewReader(tt.body))\n            rr := httptest.NewRecorder()\n\n            // Act\n            HandleOrder(rr, req)\n\n            // Assert\n            if rr.Code != http.StatusBadRequest {\n                t.Errorf(\"got %d, want 400 (body=%s)\", rr.Code, tt.body)\n            }\n        })\n    }\n}\n```\n\nGap 5 \u2014 Payment gateway failure returns 502 (Exit Door 3 + Exit Door 5) [REQUIRES REFACTOR]\nRefactor needed: extract a `Charger` interface (or `func(userID string, amount float64) (string, error)` field) on a new `OrderHandler` struct so tests can substitute the payment call instead of hitting `https://payments.example.com/charge`. Without this, the external-call exit door has no injectable seam.\n```go\nfunc TestHandleOrder_WhenChargeFails_ThenReturns502(t *testing.T) {\n    // Arrange\n    handler := &OrderHandler{ // fictitious \u2014 assumes refactor\n        Charge: func(userID string, amount float64) (string, error) {\n            return \"\", errors.New(\"gateway down\")\n        },\n    }\n    req := httptest.NewRequest(http.MethodPost, \"/orders\", strings.NewReader(`{\"user_id\":\"u1\",\"amount\":10}`))\n    rr := httptest.NewRecorder()\n\n    // Act\n    handler.ServeHTTP(rr, req)\n\n    // Assert\n    if rr.Code != http.StatusBadGateway {\n        t.Errorf(\"got %d, want 502\", rr.Code)\n    }\n}\n```\n\n### \ud83d\udfe1 Medium\n_None._\n\n### \ud83d\udfe2 Low\n_None._\n\n### \u2705 Already Covered\n_None._\n\n### \ud83d\udd01 Redundant Tests\n_None._\n\n### \u23ed\ufe0f Skipped\n- `api/orders/handler.go` Exit Door 2 (state) \u2014 dropped: source has no persistence (no DB/cache/file write).\n- `api/orders/handler.go` Exit Door 4 (queue events) \u2014 dropped: source publishes nothing.\n- `api/orders/handler.go` Exit Door 3 happy-path assertion on the outbound `https://payments.example.com/charge` call (correct URL, method, payload shape) \u2014 no injectable seam in current source; asserting it would require fictitious API. Folded into Gap 5 above as a refactor-tagged item rather than emitted twice.\n\n### Remediation Plan\n1. Create `api/orders/handler_test.go` with the Gap 2 (405), Gap 3 (malformed JSON), and Gap 4 (validation 400) tests \u2014 these run today against real `httptest.NewRecorder()` + `httptest.NewRequest()` with zero changes to `handler.go`.\n2. Add Gap 1 (happy-path 201 + Content-Type) with a note that body-shape assertion is deferred until the refactor lands; status/header assertions still provide signal.\n3. Refactor `HandleOrder` to accept a substitutable charger (interface or func field on a handler struct), then add Gap 5 (502 on gateway failure) and tighten Gap 1 to assert `order_id` / `charge_id` in the response body.\n", "grading": null, "timing": {"total_tokens": 33666, "duration_ms": 118087, "total_duration_seconds": 118.1}}, "without_skill": {"report": "# Tests for `api/orders/handler.go`\n\n## The blocker: `chargeCard` is untestable as written\n\nBefore listing tests, you need to recognize what's testable and what isn't. `chargeCard` is a **package-level free function** with a **hardcoded HTTPS URL** (`https://payments.example.com/charge`) called via the default `http.DefaultClient`. From `HandleOrder`, there is:\n\n- no interface to stub,\n- no function-variable seam (e.g. `var chargeCardFn = chargeCard`) to monkey-patch in tests,\n- no injected `*http.Client` or base URL,\n- no context, no timeout.\n\nThat means any test that calls `HandleOrder` end-to-end will **actually hit `payments.example.com`** (or fail with DNS/connection error, depending on the sandbox). You cannot meaningfully test the success path or the upstream-failure path without one of:\n\n1. **Recommended refactor (smallest):** introduce a package-level function variable so tests can swap it.\n   ```go\n   var chargeCardFn = chargeCard\n   // in HandleOrder: chargeID, err := chargeCardFn(req.UserID, req.Amount)\n   ```\n2. **Better refactor:** inject a `Charger` interface (or a `func(userID string, amount float64) (string, error)`) into a handler struct, and/or pass an `*http.Client` + base URL into `chargeCard`.\n\nPick (1) for a one-line change; pick (2) if you also want to test `chargeCard` itself against an `httptest.Server`.\n\n## Tests worth writing\n\n### A. Tests you can write **today, without any refactor** (pure-input validation paths)\n\nThese exercise the branches in `HandleOrder` that return **before** `chargeCard` is called, so they're safe and deterministic.\n\n1. **Wrong method returns 405**\n   - `GET /` (and maybe `PUT`, `DELETE`) -> `http.StatusMethodNotAllowed`, empty body.\n2. **Malformed JSON returns 400**\n   - `POST` with body `\"{not json\"` -> `http.StatusBadRequest`.\n3. **Missing `user_id` returns 400**\n   - `POST` with `{\"amount\": 10}` -> 400.\n4. **Non-positive amount returns 400**\n   - `{\"user_id\":\"u1\",\"amount\":0}` -> 400.\n   - `{\"user_id\":\"u1\",\"amount\":-5}` -> 400.\n5. **Empty body returns 400** (decoder fails on EOF).\n\nUse `httptest.NewRecorder()` + `httptest.NewRequest(...)` and call `HandleOrder` directly \u2014 no server needed.\n\n### B. Tests that require the seam (after the 1-line refactor in (1) above)\n\n6. **Happy path: 201 + correct JSON body**\n   - Swap `chargeCardFn` with `func(u string, a float64) (string, error) { return \"ch_123\", nil }`.\n   - Assert status `201`, `Content-Type: application/json`, body decodes to `CreateOrderResponse{OrderID:\"order_u1\", ChargeID:\"ch_123\"}`.\n   - Assert the stub received exactly `(\"u1\", 42.0)` (so you catch arg-mapping regressions).\n7. **Upstream charge failure returns 502**\n   - Stub returns `errors.New(\"boom\")` -> assert `http.StatusBadGateway`, no body written from the success branch.\n8. **Charge returns empty ChargeID** (edge case worth pinning)\n   - Stub returns `\"\", nil` -> currently produces `ChargeID:\"\"` in the response. Decide if that's intended; either way, lock the behavior with a test.\n9. **OrderID derivation**\n   - Verify the `\"order_\" + req.UserID` concatenation with a couple of user IDs (including one with spaces / unicode, since there's no validation).\n\nUse table-driven tests (`[]struct{ name, body string; want int }`) to compress (1)-(5) and (6)-(9).\n\n### C. Tests for `chargeCard` itself (require refactor (2), or build-tag integration tests)\n\nIf you inject `*http.Client` + base URL into `chargeCard`, add:\n\n10. **Sends correct JSON payload + content-type** \u2014 assert with `httptest.NewServer` that the request body parses to `{user_id, amount}` and `Content-Type: application/json`.\n11. **Parses `charge_id` from 200 response.**\n12. **Returns error on transport failure** (e.g. server `Close()` mid-request, or unreachable URL).\n13. **Returns error on malformed JSON response** (server writes `\"not json\"`).\n14. **Does not leak the response body** (covered implicitly by `defer resp.Body.Close()`; a `-race` run with many parallel calls is a reasonable smoke).\n15. **Non-2xx upstream status** \u2014 currently the code **ignores** `resp.StatusCode` and tries to unmarshal whatever body came back. That is a latent bug; add a failing test now (`server returns 500 with body \"internal\"`) and decide whether `chargeCard` should return an error on non-2xx.\n\n## Other issues the tests will surface (worth fixing while you're here)\n\n- `payload, _ := json.Marshal(...)` and `body, _ := io.ReadAll(...)` silently swallow errors.\n- No `context.Context` -> no cancellation, no deadline; `http.Post` uses `DefaultClient` with no timeout, so a hung gateway will hang the handler forever. Add a timeout / accept a `ctx` from `r.Context()`.\n- `HandleOrder` does no auth, no idempotency key, and trusts the client-supplied `user_id`. Probably out of scope for unit tests, but worth a TODO.\n- Status-code branch noted in test (15) above is a real bug.\n\n## Suggested file layout\n\n- `api/orders/handler_test.go` \u2014 tests A and B (table-driven).\n- `api/orders/charge_test.go` \u2014 tests C, after the DI refactor.\n\n## TL;DR\n\nWrite the 5 validation tests now (group A) \u2014 they need nothing. Then do the one-line `var chargeCardFn = chargeCard` seam and add the 4 handler-with-stub tests (group B). Only refactor `chargeCard`'s signature if you want to cover the HTTP-client behavior itself (group C); that's also where you'll catch the non-2xx-status bug.\n", "grading": null, "timing": {"total_token lready Covered\n_None._\n\n### \ud83d\udd01 Redundant Tests\n_None._\n\n### \u23ed\ufe0f Skipped\n- `apps/server/payment.controller.ts` \u2014 Exit Door 2 (state persisted) skipped: source comment claims \"writes to DB\" but no DB call exists in code. Comments do not count (Phase 4b).\n- `apps/server/payment.controller.ts` \u2014 Exit Door 3 (external call) skipped: source comment claims \"calls use-case\" but no call exists. Unlock route: implement the use-case call, then add a Tier B test injecting a seam like `var createPaymentUseCase = realCreatePaymentUseCase` and asserting it was invoked with `{ amount }`.\n- `apps/server/payment.controller.ts` \u2014 Exit Door 4 (queue events) skipped: source publishes nothing.\n\n### Remediation Plan\n1. Create `apps/server/payment.controller.test.ts` with the Fastify `app.inject()` harness from the Critical sketch (happy path, 201 + body shape).\n2. Add the missing-amount 400 test (High Gap 1).\n3. Add the parameterized invalid-amount test (High Gap 2) \u2014 the `-100` row will fail and surface the bug at `payment.controller.ts:4`.\n4. Fix the guard at line 4: `if (typeof amount !== 'number' || !Number.isFinite(amount) || amount <= 0) { ... }` \u2014 re-run; Gap 2 now green.\n5. Add the wrong-method 404 test (Low Gap 3) if you want router coverage.\n6. When the real use-case + DB write land, add Tier B tests for Exit Doors 2 and 3 (currently skipped).\n", "grading": null, "timing": {"total_tokens": 22980, "duration_ms": 56627, "total_duration_seconds": 56.6}}}}, "10": {"id": 10, "metadata": {"eval_id": 10, "eval_name": "ts-blind-spots", "prompt": "I added src/discount.ts with applyDiscount(price, percent). There is one existing test (percent=50, price=100). Use smart-coverage to find missing coverage."}, "configs": {"with_skill": {"report": "## Coverage Gap Report\n1 file changed, 6 gaps found (0 critical, 6 high, 0 medium, 0 low) + 0 redundant\n\n### \ud83d\udc1b Likely Bug Surfaced\n**`src/discount.ts:2`** \u2014 `if (!p
