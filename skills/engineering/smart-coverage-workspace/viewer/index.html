ferent cartIds, Then orderIds differ', async () => {\n    // Arrange\n    const cartA = 'cart_A'\n    const cartB = 'cart_B'\n\n    // Act\n    const a = await checkout(cartA)\n    const b = await checkout(cartB)\n\n    // Assert\n    expect(a.orderId).not.toEqual(b.orderId)\n  })\n})\n```\n\n### E2E Gaps\n\nServer-side change \u2192 `{ request }` fixture (no browser needed). Note: `playwright.config.ts` points `testDir: './e2e'`, which does not yet exist \u2014 create it alongside the test.\n\n**`e2e/checkout.spec.ts`** \u2014 Checkout API happy path (Exit Door 1) `[TDD]` (assumes HTTP route exposing the use-case; will fail until route + implementation land)\n```typescript\nimport { test, expect } from '@playwright/test'\n\ntest('When POST /api/checkout with a valid cartId, Then responds 200 with an orderId', async ({ request }) => {\n  // Arrange\n  const payload = { cartId: 'cart_e2e_1' }\n\n  // Act\n  const response = await request.post('/api/checkout', { data: payload })\n\n  // Assert\n  expect(response.ok()).toBeTruthy()\n  const body = await response.json()\n  expect(body).toHaveProperty('orderId')\n  expect(typeof body.orderId).toBe('string')\n  expect(body.orderId.length).toBeGreaterThan(0)\n})\n```\n\n### Remediation Plan\n1. Add `apps/server/checkout/checkout.use-case.test.ts` with Gap 1 (happy path returns orderId) \u2014 red until stub is replaced with real logic.\n2. Add Gap 2 (distinct cart \u2192 distinct order) to the same file to lock in identity behavior before implementation.\n3. Create `e2e/` directory (referenced by `playwright.config.ts`) and add `e2e/checkout.spec.ts` with the `{ request }` API-level happy path once an HTTP route wires the use-case.\n", "grading": null, "timing": {"total_tokens": 24620, "duration_ms": 56190, "total_duration_seconds": 56.2, "fast_pass_4a": "yes"}}}}, "6": {"id": 6, "metadata": {"eval_id": 6, "eval_name": "bash-deploy-script", "prompt": "I changed scripts/deploy.sh (a bash deployment script with no package.json or go.mod nearby). What tests should I write? Use smart-coverage.", "assertions": [{"text": "No TypeScript describe( syntax", "passed": null, "evidence": ""}, {"text": "No Go func Test syntax", "passed": null, "evidence": ""}, {"text": "Generic AAA or fallback handling present", "passed": null, "evidence": ""}]}, "configs": {"with_skill": {"report": "## Coverage Gap Report\n1 file changed, 3 gaps found (0 critical, 2 high, 0 medium, 1 low)\n\n`scripts/deploy.sh` \u2014 Script / executable. Exits: 3 (external CLI), 5 (error propagation). No tests exist.\n\n### \ud83d\udfe0 High\n**`scripts/deploy.sh`**\n\nGap 1 \u2014 kubectl invoked with correct args (Exit Door 3)\n```bash\n#!/usr/bin/env bats\n\nsetup() {\n  STUB_DIR=\"$BATS_TEST_TMPDIR/stubs\"\n  mkdir -p \"$STUB_DIR\"\n  printf '#!/usr/bin/env bash\\necho \"$@\" >> \"$BATS_TEST_TMPDIR/kubectl-calls\"\\nexit 0\\n' > \"$STUB_DIR/kubectl\"\n  chmod +x \"$STUB_DIR/kubectl\"\n  export PATH=\"$STUB_DIR:$PATH\"\n}\n\n@test \"When deploy runs, Then kubectl apply is called with k8s/ manifest dir\" {\n  # Arrange \u2014 stub installed in setup()\n  # Act\n  run scripts/deploy.sh\n  # Assert\n  [ \"$status\" -eq 0 ]\n  grep -qx \"apply -f k8s/\" \"$BATS_TEST_TMPDIR/kubectl-calls\"\n}\n```\n\nGap 2 \u2014 kubectl failure propagates non-zero exit (Exit Door 5)\n```bash\n@test \"When kubectl apply fails, Then deploy.sh exits non-zero\" {\n  # Arrange \u2014 override stub to fail\n  STUB_DIR=\"$BATS_TEST_TMPDIR/stubs\"\n  mkdir -p \"$STUB_DIR\"\n  printf '#!/usr/bin/env bash\\nexit 2\\n' > \"$STUB_DIR/kubectl\"\n  chmod +x \"$STUB_DIR/kubectl\"\n  export PATH=\"$STUB_DIR:$PATH\"\n  # Act\n  run scripts/deploy.sh\n  # Assert \u2014 set -e must propagate\n  [ \"$status\" -ne 0 ]\n}\n```\n\n### \ud83d\udfe2 Low\n**`scripts/deploy.sh`**\n\nGap 3 \u2014 startup banner emitted on stdout (Exit Door 1)\n```bash\n@test \"When deploy runs, Then it announces 'Deploying...' on stdout\" {\n  run scripts/deploy.sh\n  [ \"$status\" -eq 0 ]\n  [[ \"$output\" == *\"Deploying...\"* ]]\n}\n```\n\n### Remediation Plan\n1. Create `tests/deploy.bats` with the `setup()` helper that PATH-shadows `kubectl` into `$BATS_TEST_TMPDIR/stubs`.\n2. Add Gap 1 (High, ED 3) \u2014 assert `kubectl apply -f k8s/` is the exact invocation.\n3. Add Gap 2 (High, ED 5) \u2014 override the stub to `exit 2` and assert the script's exit status is non-zero (proves `set -e` wiring).\n4. Add Gap 3 (Low, ED 1) \u2014 assert the \"Deploying...\" banner on stdout.\n", "grading": null, "timing": {"total_tokens": 23210, "duration_ms": 51154, "total_duration_seconds": 51.2, "fast_pass_4a": "no"}}}}, "8": {"id": 8, "metadata": {"eval_id": 8, "eval_name": "go-dead-tests", "prompt": "I modified billing/billing.go \u2014 I deleted ProcessRefund and renamed CalculateTax to ComputeTax. The existing billing/billing_test.go still references the old names. Use smart-coverage."}, "configs": {"with_skill": {"report": "## Coverage Gap Report\n1 file changed, 1 gap found (0 critical, 1 high, 0 medium, 0 low) + 4 redundant\n\n### \ud83d\udfe0 High\n**`billing/billing.go`**\n\nGap 1 \u2014 `ComputeTax` negative-subtotal boundary uncovered (Exit Door 5)\nThe renamed `ComputeTax` now guards `subtotal < 0`, but no test asserts that path. Once the DEAD tests below are replaced, the rate-out-of-range path is restored, but the negative-subtotal branch is still untested.\n\nThe full replacement `billing_test.go` (see \u00a7 Concrete Patches) includes the missing case.\n\n### \ud83d\udd01 Redundant Tests\n- `billing/billing_test.go::TestCalculateTax_WhenValid_ThenReturnsTax` \u2014 [DEAD] `CalculateTax` renamed to `ComputeTax`. Human review: replace with `ComputeTax` call (see patch).\n- `billing/billing_test.go::TestCalculateTax_WhenRateOutOfRange_ThenReturnsError` \u2014 [DEAD] `CalculateTax` renamed to `ComputeTax`. Human review: replace with `ComputeTax` call (see patch).\n- `billing/billing_test.go::TestProcessRefund_WhenValid_ThenNoError` \u2014 [DEAD] `ProcessRefund` removed. Human review: delete.\n- `billing/billing_test.go::TestProcessRefund_WhenAmountZero_ThenReturnsError` \u2014 [DEAD] `ProcessRefund` removed. Human review: delete.\n\n### Concrete Patches\n\nFull replacement for `billing/billing_test.go`:\n\n```go\npackage billing\n\nimport \"testing\"\n\nfunc TestComputeTax_WhenValid_ThenReturnsTax(t *testing.T) {\n\t// Arrange\n\tsubtotal, rate := 100.0, 0.1\n\t// Act\n\tgot, err := ComputeTax(subtotal, rate)\n\t// Assert\n\tif err != nil {\n\t\tt.Fatalf(\"unexpected error: %v\", err)\n\t}\n\tif got != 10.0 {\n\t\tt.Errorf(\"got %v, want 10.0\", got)\n\t}\n}\n\nfunc TestComputeTax_WhenRateAboveOne_ThenReturnsError(t *testing.T) {\n\tif _, err := ComputeTax(100.0, 1.5); err == nil {\n\t\tt.Error(\"expected error for rate > 1\")\n\t}\n}\n\nfunc TestComputeTax_WhenRateNegative_ThenReturnsError(t *testing.T) {\n\tif _, err := ComputeTax(100.0, -0.1); err == nil {\n\t\tt.Error(\"expected error for rate < 0\")\n\t}\n}\n\nfunc TestComputeTax_WhenSubtotalNegative_ThenReturnsError(t *testing.T) {\n\tif _, err := ComputeTax(-1.0, 0.1); err == nil {\n\t\tt.Error(\"expected error for subtotal < 0\")\n\t}\n}\n```\n\n### Remediation Plan\n1. Replace `billing/billing_test.go` with the block above \u2014 removes 4 DEAD tests, restores happy + rate>1 coverage, and adds the missing `rate < 0` and `subtotal < 0` branches.\n", "grading": null, "timing": {"total_tokens": 23388, "duration_ms": 50801, "total_duration_seconds": 50.8, "fast_pass_4a": "no"}}}}, "9": {"id": 9, "metadata": {"eval_id": 9, "eval_name": "go-speculative-api", "prompt": "I added api/orders/handler.go with HandleOrder that calls a package-level chargeCard function (no interface, no DI, hardcoded HTTPS endpoint). What tests should I write? Use smart-coverage."}, "configs": {"with_skill": {"report": "## Coverage Gap Report\n1 file changed, 7 gaps found (1 critical, 4 high, 1 medium, 1 low)\n\n### \ud83d\udc1b Likely Bug Surfaced\n**`api/orders/handler.go:28-40`** \u2014 `chargeCard` never checks `resp.StatusCode`; a 4xx/5xx from the gateway with an empty/garbage body is treated as success and returns `ChargeID=\"\"`, so `HandleOrder` responds `201 Created` with `charge_id:\"\"`. Fix: `if resp.StatusCode < 200 || resp.StatusCode >= 300 { return \"\", fmt.Errorf(\"charge failed: %s\", resp.Status) }` before reading the body.\n\n**`api/orders/handler.go:24`** \u2014 `json.Marshal` error is discarded (`payload, _ := ...`). Any marshal failure produces a nil payload that is silently POSTed. Fix: `payload, err := json.Marshal(...); if err != nil { return \"\", err }`.\n\n**`api/orders/handler.go:33`** \u2014 `io.ReadAll` error is discarded (`body, _ := ...`). A truncated response body becomes a successful empty parse. Fix: `body, err := io.ReadAll(resp.Body); if err != nil { return \"\", err }`.\n\n**`api/orders/handler.go:28`** \u2014 Hardcoded `https://payments.example.com/charge` with package-level `http.Post` means there is no seam for tests, no timeout, and no way to point at a sandbox in non-prod. Fix: extract `var chargeCardFn = chargeCard` (1-line seam, unlocks Tier B) and longer-term move the URL + `*http.Client` behind a struct (Tier C).\n\n### \ud83d\udd34 Critical\n**`api/orders/handler.go`** \u2014 HTTP route with zero tests. At minimum the method-guard and validation paths are writeable today against current source with no refactor.\n\n**Tier A \u2014 writeable today (no source change)**\n\n```go\npackage orders\n\nimport (\n    \"net/http\"\n    \"net/http/httptest\"\n    \"strings\"\n    \"testing\"\n)\n\nfunc TestHandleOrder_WhenMethodIsGet_ThenReturns405(t *testing.T) {\n    // Arrange\n    req := httptest.NewRequest(http.MethodGet, \"/orders\", nil)\n    rr := httptest.NewRecorder()\n    // Act\n    HandleOrder(rr, req)\n    // Assert\n    if rr.Code != http.StatusMethodNotAllowed {\n        t.Fatalf(\"got %d, want 405\", rr.Code)\n    }\n}\n\nfunc TestHandleOrder_WhenBodyIsMalformedJSON_ThenReturns400(t *testing.T) {\n    req := httptest.NewRequest(http.MethodPost, \"/orders\", strings.NewReader(`{not json`))\n    rr := httptest.NewRecorder()\n    HandleOrder(rr, req)\n    if rr.Code != http.StatusBadRequest {\n        t.Fatalf(\"got %d, want 400\", rr.Code)\n    }\n}\n\nfunc TestHandleOrder_WhenValidationFails_ThenReturns400(t *testing.T) {\n    tests := []struct {\n        name string\n        body string\n    }{\n        {\"When user_id is empty, Then 400\", `{\"user_id\":\"\",\"amount\":10}`},\n        {\"When amount is zero, Then 400\", `{\"user_id\":\"u1\",\"amount\":0}`},\n        {\"When amount is negative, Then 400\", `{\"user_id\":\"u1\",\"amount\":-5}`},\n    }\n    for _, tt := range tests {\n        t.Run(tt.name, func(t *testing.T) {\n            req := httptest.NewRequest(http.MethodPost, \"/orders\", strings.NewReader(tt.body))\n            rr := httptest.NewRecorder()\n            HandleOrder(rr, req)\n            if rr.Code != http.StatusBadRequest {\n                t.Fatalf(\"got %d, want 400\", rr.Code)\n            }\n        })\n    }\n}\n```\n\n### \ud83d\udfe0 High\n\n**`api/orders/handler.go`** \u2014 Happy path (ED 1 response shape + status) `[REQUIRES REFACTOR]`\n\nBlocked by the package-level `chargeCard` call; cannot be exercised without hitting `payments.example.com`. Unlocked by the 1-line seam in Phase 4a.\n\n**Tier B \u2014 after adding `var chargeCardFn = chargeCard` and changing line 57 to `chargeCardFn(...)`**\n\n```go\nfunc TestHandleOrder_WhenChargeSucceeds_ThenReturns201WithOrderAndChargeID(t *testing.T) {\n    // Arrange\n    orig := chargeCardFn\n    defer func() { chargeCardFn = orig }()\n    chargeCardFn = func(userID string, amount float64) (string, error) {\n        if userID != \"u1\" || amount != 42.5 {\n            t.Fatalf(\"chargeCard got (%q,%v), want (u1,42.5)\", userID, amount)\n        }\n        return \"ch_123\", nil\n    }\n    req := httptest.NewRequest(http.MethodPost, \"/orders\", strings.NewReader(`{\"user_id\":\"u1\",\"amount\":42.5}`))\n    rr := httptest.NewRecorder()\n    // Act\n    HandleOrder(rr, req)\n    // Assert\n    if rr.Code != http.StatusCreated {\n        t.Fatalf(\"got %d, want 201\", rr.Code)\n    }\n    if ct := rr.Header().Get(\"Content-Type\"); ct != \"application/json\" {\n        t.Errorf(\"Content-Type = %q, want application/json\", ct)\n    }\n    var out CreateOrderResponse\n    if err := json.NewDecoder(rr.Body).Decode(&out); err != nil {\n        t.Fatalf(\"decode: %v\", err)\n    }\n    if out.OrderID != \"order_u1\" || out.ChargeID != \"ch_123\" {\n        t.Errorf(\"got %+v\", out)\n    }\n}\n```\n\n**`api/orders/handler.go`** \u2014 Upstream failure \u2192 502 (ED 5 error path) `[REQUIRES REFACTOR]`\n\n**Tier B**\n\n```go\nfunc TestHandleOrder_WhenChargeFails_ThenReturns502(t *testing.T) {\n    orig := chargeCardFn\n    defer func() { chargeCardFn = orig }()\n    chargeCardFn = func(string, float64) (string, error) {\n        return \"\", errors.New(\"gateway down\")\n    }\n    req := httptest.NewRequest(http.MethodPost, \"/orders\", strings.NewReader(`{\"user_id\":\"u1\",\"amount\":10}`))\n    rr := httptest.NewRecorder()\n    HandleOrder(rr, req)\n    if rr.Code != http.StatusBadGateway {\n        t.Fatalf(\"got %d, want 502\", rr.Code)\n    }\n}\n```\n\n**`api/orders/handler.go`** \u2014 Argument mapping into `chargeCard` (ED 3 external-call correctness) `[REQUIRES REFACTOR]`\n\nAlready asserted inline in the happy-path Tier B test above (the `userID/amount` check inside the fake). Listed separately so the gap is not lost if the happy-path test is later trimmed.\n\n**`api/orders/handler.go:28-40`** \u2014 Non-2xx gateway response is silently treated as success (the bug surfaced above). Tier B test only becomes meaningful **after** the bug is fixed; until then this test would fail-by-design and document the bug.\n\n**Tier C \u2014 after extracting `chargeCard` behind an interface or `*http.Client` with injectable URL**\n\n```go\n// fictitious \u2014 assumes refactor that lets us point chargeCard at httptest.NewServer\nfunc TestHandleOrder_WhenGatewayReturns500_ThenReturns502(t *testing.T) {\n    srv := httptest.NewServer(http.HandlerFunc(func(w http.ResponseWriter, _ *http.Request) {\n        w.WriteHeader(http.StatusInternalServerError)\n        w.Write([]byte(`{}`))\n    }))\n    defer srv.Close()\n    // depends on refactor exposing a way to set gateway URL on a handler instance\n    h := NewOrderHandler(srv.URL)               // fictitious \u2014 assumes refactor\n    req := httptest.NewRequest(http.MethodPost, \"/orders\", strings.NewReader(`{\"user_id\":\"u1\",\"amount\":10}`))\n    rr := httptest.NewRecorder()\n    h.ServeHTTP(rr, req)\n    if rr.Code != http.StatusBadGateway {\n        t.Fatalf(\"got %d, want 502 once bug is fixed\", rr.Code)\n    }\n}\n```\n\n### \ud83d\udfe1 Medium\n\n**`api/orders/handler.go`** \u2014 Boundary at `req.Amount <= 0`: the just-above-zero case (`0.01`) is the smallest positive value that should pass. Covered transitively by the happy path, but worth pinning as an explicit boundary test.\n\n**Tier B**\n\n```go\nfunc TestHandleOrder_WhenAmountIsSmallestPositive_ThenReturns201(t *testing.T) {\n    orig := chargeCardFn\n    defer func() { chargeCardFn = orig }()\n    chargeCardFn = func(string, float64) (string, error) { return \"ch_ok\", nil }\n    req := httptest.NewRequest(http.MethodPost, \"/orders\", strings.NewReader(`{\"user_id\":\"u1\",\"amount\":0.01}`))\n    rr := httptest.NewRecorder()\n    HandleOrder(rr, req)\n    if rr.Code != http.StatusCreated {\n        t.Fatalf(\"got %d, want 201\", rr.Code)\n    }\n}\n```\n\n### \ud83d\udfe2 Low\n\n**`api/orders/handler.go`** \u2014 Empty request body (`Content-Length: 0`) is a distinct decode-failure variant from \"malformed JSON\". Cheap to add to the table-driven 400 test.\n\n### \u23ed\ufe0f Skipped\n- `api/orders/handler.go` chargeCard happy/error paths against a real `httptest.NewServer` \u2014 `no injectable seam \u2014 would require fictitious API`. Unlock via Phase 4a Tier C (extract URL + `*http.Client` behind a struct).\n\n### Remediation Plan\n1. Add `api/orders/handler_test.go` with the three Tier A tests (method guard, malformed JSON, validation table). No source change required.\n2. Fix the non-2xx-treated-as-success bug in `chargeCard` (Phase 4a \u00a7 Likely Bug).\n3. Fix the two discarded errors (`json.Marshal`, `io.ReadAll`) in `chargeCard`.\n4. Add the 1-line seam `var chargeCardFn = chargeCard` and change line 57 to call `chargeCardFn`. Then add the Tier B tests: happy path (asserts 201 + body + arg mapping), gateway failure \u2192 502, smallest-positive-amount boundary.\n5. (Follow-up refactor) Extract `chargeCard` behind a struct that takes gateway URL + `*http.Client`, then add Tier C tests using `httptest.NewServer` for real HTTP behavior (non-2xx, timeouts, malformed body).\n", "grading": null, "timing": {"total_tokens": 24012, "duration_ms": 77296, "total_duration_seconds": 77.3, "fast_pass_4a": "no"}}}}}}};

const evalNames = {};
for (const ev of EVALS.evals || []) {
  evalNames[ev.id] = ev.prompt ? ev.prompt.slice(0, 60).replace(/\s+/g, ' ') + '...' : 'eval ' + ev.id;
}

let currentSelection = null; // {iter, evalId, config}

function el(tag, props, ...children) {
  const e = document.createElement(tag);
  if (props) for (const k in props) {
    if (k === 'class') e.className = props[k];
    else if (k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), props[k]);
    else if (k === 'html') e.innerHTML = props[k];
    else e.setAttribute(k, props[k]);
  }
  for (const c of children) {
    if (c == null) continue;
    if (typeof c === 'string') e.appendChild(document.createTextNode(c));
    else e.appendChild(c);
  }
  return e;
}

function buildSidebar() {
  const sb = document.getElementById('sidebar');
  sb.innerHTML = '';
  const iters = Object.keys(DATA).map(Number).sort((a, b) => b - a);
  for (const it of iters) {
    const group = el('div', { class: 'iter-group' });
    group.appendChild(el('div', { class: 'iter-header' }, 'Iteration ' + it));
    const evals = Object.keys(DATA[it].evals).map(Number).sort((a, b) => a - b);
    for (const ev of evals) {
      const data = DATA[it].evals[ev];
      const name = data.metadata?.eval_name || evalNames[ev] || ('eval ' + ev);
      const cfgs = Object.keys(data.configs);
      const row = el('div', {
        class: 'eval-row',
        onclick: () => select(it, ev),
      },
        el('span', { class: 'name' }, 'Eval ' + ev + ' — ' + name),
        el('span', { class: 'sub' }, cfgs.join(' · ')),
      );
      row.dataset.iter = it;
      row.dataset.eval = ev;
      group.appendChild(row);
    }
    sb.appendChild(group);
  }
  document.getElementById('meta').textContent = iters.length + ' iterations · ' + (EVALS.evals?.length || 0) + ' evals defined';
}

function highlightSidebar() {
  document.querySelectorAll('.eval-row').forEach(r => {
    r.classList.toggle('active',
      currentSelection &&
      r.dataset.iter === String(currentSelection.iter) &&
      r.dataset.eval === String(currentSelection.evalId));
  });
}

function select(iter, evalId, config) {
  const data = DATA[iter].evals[evalId];
  if (!data) return;
  const cfgKeys = Object.keys(data.configs);
  if (!config || !cfgKeys.includes(config)) {
    config = cfgKeys.includes('with_skill') ? 'with_skill' : cfgKeys[0];
  }
  currentSelection = { iter, evalId, config };
  render();
  highlightSidebar();
}

function render() {
  const main = document.getElementById('main');
  if (!currentSelection) { main.innerHTML = '<div class="empty">Select an eval from the sidebar.</div>'; return; }
  const { iter, evalId, config } = currentSelection;
  const evalData = DATA[iter].evals[evalId];
  const evalDef = (EVALS.evals || []).find(e => e.id === evalId);
  main.innerHTML = '';

  // Controls — iteration selector
  const iters = Object.keys(DATA).map(Number).sort((a, b) => b - a);
  const iterSelect = el('select', {
    class: 'iter-select',
    onchange: (e) => select(Number(e.target.value), evalId, config),
  });
  for (const i of iters) {
    if (DATA[i].evals[evalId]) {
      const opt = el('option', { value: i }, 'Iteration ' + i);
      if (i === iter) opt.selected = true;
      iterSelect.appendChild(opt);
    }
  }
  const controls = el('div', { class: 'controls' },
    el('span', { class: 'label' }, 'Iteration:'),
    iterSelect,
    el('span', { class: 'label' }, 'Eval ' + evalId + (evalData.metadata?.eval_name ? ' — ' + evalData.metadata.eval_name : '')),
  );
  main.appendChild(controls);

  // Prompt panel
  const prompt = evalData.metadata?.prompt || evalDef?.prompt || '(no prompt recorded)';
  main.appendChild(el('section', { class: 'panel' },
    el('h2', null, 'Prompt'),
    el('div', { class: 'prompt' }, prompt),
  ));

  // Expected output panel (from evals.json)
  if (evalDef?.expected_output) {
    main.appendChild(el('section', { class: 'panel' },
      el('h2', null, 'Expected Output'),
      el('div', { class: 'prompt' }, evalDef.expected_output),
    ));
  }

  // Config tabs
  const cfgKeys = Object.keys(evalData.configs);
  const tabs = el('div', { class: 'config-tabs' });
  for (const cfg of cfgKeys) {
    const grading = evalData.configs[cfg].grading;
    let badge = '';
    if (grading) {
      const s = grading.summary || {};
      badge = (s.passed ?? 0) + '/' + (s.total ?? 0);
    }
    const tab = el('button', {
      class: 'config-tab' + (cfg === config ? ' active' : ''),
      onclick: () => select(iter, evalId, cfg),
    }, cfg);
    if (badge) tab.appendChild(el('span', { class: 'badge' }, badge));
    tabs.appendChild(tab);
  }
  main.appendChild(tabs);

  const cfgData = evalData.configs[config] || {};

  // Stats
  if (cfgData.timing) {
    const t = cfgData.timing;
    const stats = el('div', { class: 'stats' });
    if (t.total_tokens != null) stats.appendChild(el('span', { class: 'stat' }, el('strong', null, t.total_tokens.toLocaleString()), ' tokens'));
    if (t.total_duration_seconds != null) stats.appendChild(el('span', { class: 'stat' }, el('strong', null, t.total_duration_seconds.toFixed(1) + 's'), ' duration'));
    main.appendChild(stats);
  }

  // Report
  main.appendChild(el('section', { class: 'panel' },
    el('h2', null, 'Output Report — ' + config),
    cfgData.report
      ? el('div', { class: 'report' }, cfgData.report)
      : el('div', { class: 'empty' }, 'No report.md found for this configuration.'),
  ));

  // Grading
  if (cfgData.grading) {
    const expectations = cfgData.grading.expectations || [];
    const grading = el('div', { class: 'grading' });
    for (const a of expectations) {
      const status = a.passed === true ? 'badge-pass' : a.passed === false ? 'badge-fail' : 'badge-pending';
      const label = a.passed === true ? 'PASS' : a.passed === false ? 'FAIL' : '...';
      grading.appendChild(el('div', { class: 'assertion' },
        el('span', { class: status }, label),
        el('div', { class: 'text' },
          el('div', null, a.text),
          a.evidence ? el('div', { class: 'evidence' }, a.evidence) : null,
        ),
      ));
    }
    main.appendChild(el('section', { class: 'panel' },
      el('h2', null, 'Grading'),
      grading,
    ));
  }

  // Feedback (iteration-level, filtered to this run-id if present)
  const fb = DATA[iter].feedback;
  if (fb?.reviews) {
    const runId = 'eval-' + evalId + '-' + config;
    const relevant = fb.reviews.filter(r => r.run_id === runId);
    if (relevant.length) {
      const block = el('div');
      for (const r of relevant) {
        block.appendChild(el('div', { class: 'feedback' }, r.feedback || ''));
      }
      main.appendChild(el('section', { class: 'panel' },
        el('h2', null, 'Reviewer Feedback'),
        block,
      ));
    }
  }
}

buildSidebar();

if (iters.length) {
  const firstIter = iters[0];
  const firstEval = Object.keys(DATA[firstIter].evals).map(Number).sort((a, b) => a - b)[0];
  if (firstEval != null) select(firstIter, firstEval);
}
